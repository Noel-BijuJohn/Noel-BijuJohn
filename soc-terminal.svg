<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" font-family="monospace">
  <defs>
    <linearGradient id="goldfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1c"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="858" height="238" rx="10" fill="#0a0a0a" stroke="#C9A227" stroke-width="2"/>
  <rect x="1" y="1" width="858" height="34" rx="10" fill="#111111"/>
  <rect x="1" y="20" width="858" height="15" fill="#111111"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="430" y="23" text-anchor="middle" font-size="13" fill="#C9A227" letter-spacing="2">noel-soc — live threat monitor</text>

  <text x="24" y="62" font-size="14" fill="#ffffff" opacity="0">$
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/>
    <tspan> soc-monitor --live --analyst noel</tspan>
  </text>
  <text x="24" y="88" font-size="14" fill="#28c840" opacity="0">[+] sensor grid online
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="24" y="114" font-size="14" fill="#28c840" opacity="0">[+] ingested 40,294 packets · 6 hosts
    <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="24" y="140" font-size="14" fill="#ff5f57" opacity="0">[!] ALERT: psexec lateral movement — 10.0.0.130 -&gt; SALES-PC
    <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="24" y="166" font-size="14" fill="#C9A227" opacity="0">[*] iocs mapped to mitre att&amp;ck · detections validated
    <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="24" y="192" font-size="14" fill="#ffffff" opacity="0">[+] verdict:
    <animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.3s" fill="freeze"/>
    <tspan fill="#C9A227" font-weight="bold"> blue team wins</tspan>
  </text>
  <rect x="238" y="180" width="10" height="16" fill="#C9A227" opacity="0">
    <animate attributeName="opacity" values="0;0" begin="0s" dur="4.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" begin="4.4s" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
